<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Панель управления - Speech to Text</title>
    <style>
      html, body { min-height: 100%; background: #0b0f19; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f8fafc; }
      #startup-loading { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; color: #cbd5e1; font-size: 14px; }
      #startup-loading-spinner { width: 28px; height: 28px; border: 3px solid #243048; border-top-color: #60a5fa; border-radius: 50%; animation: startup-spin 0.8s linear infinite; }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #startup-loading-spinner { animation-duration: 2s; } }
    </style>
  </head>
  <body>
    <div id="startup-loading" role="status" aria-live="polite">
      <div id="startup-loading-spinner" aria-hidden="true"></div>
      <span id="startup-loading-message">Запускаем приложение…</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
