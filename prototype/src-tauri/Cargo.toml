[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
fern = "0.7"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2"
hound = "3.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
cpal = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["ApplicationModel_DataTransfer", "Foundation", "Storage_Streams", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
