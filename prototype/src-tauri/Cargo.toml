[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
fern = "0.7"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2"
hound = "3.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
cpal = "0.18.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"
# Edge TTS streaming over WebSocket.
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["time", "sync"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["ApplicationModel_DataTransfer", "Foundation", "Storage_Streams", "Win32_System_WinRT", "Media_SpeechSynthesis", "Media_Core", "Win32_Media_Audio", "Win32_System_Com", "Win32_UI_Accessibility"] }
windows-future = "0.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry", "Win32_UI_Controls_Dialogs", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_Security"] }
